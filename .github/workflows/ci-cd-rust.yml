name: CI/CD

on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
      binary_name:
        required: false
        type: string
      run_before_test:
        required: false
        type: string
      test_args:
        required: false
        type: string
      check_args:
        required: false
        type: string
      docker_name:
        required: false
        type: string
        default: ""
      docker_args:
        required: false
        type: string
      cargo_publish:
        required: false
        type: boolean
      matrix:
        required: false
        type: string
        default: |
          [
            {
              "target": "x86_64-unknown-linux-gnu",
              "os": "ubuntu-24.04",
              "test": true
            },
            {
              "target": "x86_64-unknown-linux-musl",
              "os": "ubuntu-24.04"
            },
            {
              "target": "aarch64-unknown-linux-gnu",
              "os": "ubuntu-24.04-arm"
            },
            {
              "target": "aarch64-unknown-linux-musl",
              "os": "ubuntu-24.04-arm"
            },
            {
              "target": "aarch64-apple-darwin",
              "os": "macos-15"
            },
            {
              "target": "x86_64-apple-darwin",
              "os": "macos-15-intel"
            },
            {
              "target": "x86_64-pc-windows-msvc",
              "os": "windows-latest"
            },
            {
              "target": "aarch64-pc-windows-msvc",
              "os": "windows-11-arm"
            }
          ]
      brew_repo:
        required: false
        type: string
        default: ""
      brew_formula:
        required: false
        type: string
        default: ""
    secrets:
      cargo_registry_token:
        required: true
      docker_password:
        required: false
      brew_repo_token:
        required: false
    outputs:
      version:
        value: ${{ jobs.surveyor.outputs.version }}
      stage:
        value: ${{ jobs.surveyor.outputs.stage }}
      channel:
        value: ${{ jobs.surveyor.outputs.channel }}
      change:
        value: ${{ jobs.surveyor.outputs.change }}
      tagged:
        value: ${{ jobs.surveyor.outputs.tagged }}

jobs:

  surveyor:
    name: Surveyor
    uses: StudioLE/Actions/.github/workflows/rust-surveyor.yml@v8

  cargo-build:
    name: Cargo Build
    uses: StudioLE/Actions/.github/workflows/cargo-build.yml@v8
    needs:
    - surveyor
    with:
      version: ${{ needs.surveyor.outputs.version }}
      package_name: ${{ inputs.package_name }}
      binary_name: ${{ inputs.binary_name }}
      run_before_test: ${{ inputs.run_before_test }}
      test_args: ${{ inputs.test_args }}
      check_args: ${{ inputs.check_args }}
      matrix: ${{ inputs.matrix }}

  git-tag:
    name: Tag
    if: needs.surveyor.outputs.stage == 'prerelease'
    uses: StudioLE/Actions/.github/workflows/git-tag.yml@v8
    needs:
    - surveyor
    - cargo-build
    with:
      version: ${{ needs.surveyor.outputs.version }}

  github-release:
    name: Release
    if: needs.surveyor.outputs.stage == 'release'
    uses: StudioLE/Actions/.github/workflows/github-release.yml@v8
    needs:
    - surveyor
    - cargo-build
    with:
      stage: ${{ needs.surveyor.outputs.stage }}
      version: ${{ needs.surveyor.outputs.version }}
      binary_name: ${{ inputs.binary_name }}

  brew:
    name: Brew
    if: needs.surveyor.outputs.stage == 'release' && inputs.brew_repo != '' && inputs.brew_formula != ''
    uses: StudioLE/Actions/.github/workflows/brew-release.yml@v8
    needs:
    - surveyor
    - github-release
    with:
      version: ${{ needs.surveyor.outputs.version }}
      binary_name: ${{ inputs.binary_name }}
      brew_repo: ${{ inputs.brew_repo }}
      brew_formula: ${{ inputs.brew_formula }}
    secrets:
      brew_repo_token: ${{ secrets.brew_repo_token }}

  cargo-publish:
    name: Cargo Publish
    if: needs.surveyor.outputs.stage == 'release' && inputs.cargo_publish && needs.surveyor.outputs.cargo_publish_args != ''
    uses: StudioLE/Actions/.github/workflows/cargo-publish.yml@v8
    needs:
    - surveyor
    - github-release
    with:
      cargo_publish_args: ${{ needs.surveyor.outputs.cargo_publish_args }}
    secrets:
      cargo_registry_token: ${{ secrets.cargo_registry_token }}

  docker-build:
    name: Docker Build
    if: github.ref_type == 'branch' && contains(fromJSON('["main", "alpha", "beta", "release"]'), github.ref_name) && inputs.docker_name != ''
    uses: StudioLE/Actions/.github/workflows/docker-build.yml@v8
    needs:
    - surveyor
    with:
      version: ${{ needs.surveyor.outputs.version }}
      name: ${{ inputs.docker_name }}
      user: studiole
      args: ${{ inputs.docker_args }}
    secrets:
      password: ${{ secrets.docker_password }}

  docker-push-prerelease:
    name: Docker Prerelease
    if: needs.surveyor.outputs.stage == 'prerelease'
    needs:
    - surveyor
    - docker-build
    uses: StudioLE/Actions/.github/workflows/docker-push.yml@v8
    with:
      name: ${{ inputs.docker_name }}
      user: studiole
      version: ${{ needs.surveyor.outputs.version }}
      tag: alpha
    secrets:
      password: ${{ secrets.docker_password }}

  docker-push-release:
    name: Docker Release
    if: needs.surveyor.outputs.stage == 'release'
    needs:
    - surveyor
    - docker-build
    uses: StudioLE/Actions/.github/workflows/docker-push.yml@v8
    with:
      name: ${{ inputs.docker_name }}
      user: studiole
      version: ${{ needs.surveyor.outputs.version }}
      tag: latest
    secrets:
      password: ${{ secrets.docker_password }}
