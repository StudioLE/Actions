name: Push to Repo

on:
  workflow_call:
    inputs:
      os:
        required: false
        type: string
        default: ubuntu-latest
      repo:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ''
      rm:
        required: false
        type: string
        default: ''
      artifact:
        required: true
        type: string
      path:
        required: true
        type: string
      copy:
        required: false
        type: string
        default: ''
      message:
        required: false
        type: string
      user_name:
        required: false
        type: string
        default: StudioLE Bot
      user_email:
        required: false
        type: string
        default: bot@studiole.uk
      sign:
        required: false
        type: string
    secrets:
      repo_token:
        required: true
      gpg_key_id:
        required: false
        description: 'GPG key ID for signing commits'
      gpg_private_key:
        required: false
        description: 'GPG private key for signing commits'

jobs:

  commit:
    name: Push to Repo
    runs-on: ${{ inputs.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_CERT_REVOCATION_MODE: offline
      DOTNET_NUGET_SIGNATURE_VERIFICATION: false
    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repo }}
        ref: ${{ inputs.ref }}
        token: ${{ secrets.repo_token }}

    - name: Configure GPG for non-interactive use
      if: inputs.sign == 'true'
      run: |
        mkdir -p ~/.gnupg
        chmod 700 ~/.gnupg
        echo "use-agent" > ~/.gnupg/gpg.conf
        echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf

    - name: Import GPG key
      if: inputs.sign == 'true'
      run: |
        echo "${{ secrets.gpg_private_key }}" | gpg --batch --import
        echo "Imported GPG key successfully"
        gpg --list-secret-keys --keyid-format=long

    - name: Configure git to use GPG signing
      if: inputs.sign == 'true'
      run: |
        git config user.signingkey "${{ secrets.gpg_key_id }}"
        git config commit.gpgsign true
        git config gpg.program gpg

    - name: Remove
      if: inputs.rm != ''
      continue-on-error: true
      run: rm -rf ${{ inputs.rm }}

    - name: Download
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact }}
        path: ${{ inputs.path }}

    - name: List
      run: ls -R1 "${{ inputs.path }}"

    - name: Copy
      if: inputs.copy != ''
      run: cp -r "${{ inputs.path }}" "${{ inputs.copy }}"

    - name: Commit
      run: |
        git config user.name "${{ inputs.user_name }}"
        git config user.email "${{ inputs.user_email }}"

        if [ "${{ inputs.sign }}" == "true" ]
        then
          echo "GPG signing enabled with key: ${{ secrets.gpg_key_id }}"
        fi

        git add --all
        git commit --allow-empty -m "$(cat <<'EOF'
        ${{ inputs.message }}
        EOF
        )"

    - name: Status
      run: git status

    - name: Push
      run: git push

    - name: Cleanup GPG
      if: always() && inputs.sign == 'true'
      run: |
        # Remove imported GPG keys from runner
        gpg --batch --yes --delete-secret-keys "${{ secrets.gpg_key_id }}" 2>/dev/null || true
        gpg --batch --yes --delete-keys "${{ secrets.gpg_key_id }}" 2>/dev/null || true

        # Kill GPG agent
        gpgconf --kill gpg-agent 2>/dev/null || true

        # Securely shred GPG directory (defense-in-depth)
        if command -v shred >/dev/null 2>&1
        then
          find ~/.gnupg -type f -exec shred -vfz -n 3 {} \;
        fi
        rm -rf ~/.gnupg
