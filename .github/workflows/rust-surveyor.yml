name: Surveyor

on:
  workflow_call:
    outputs:
      version:
        description: Version written to the manifests.
        value: ${{ jobs.surveyor.outputs.version }}
      stage:
        description: |
          Release stage of the version.

          - `release`, `prerelease`, or `development`
        value: ${{ jobs.surveyor.outputs.stage }}
      channel:
        description: |
          Channel name, e.g. `alpha`.

          - Empty for development builds
        value: ${{ jobs.surveyor.outputs.channel }}
      change:
        description: |
          Biggest change across the commits since the previous release.

          - `major`, `minor`, `patch`, or `none`
        value: ${{ jobs.surveyor.outputs.change }}
      tagged:
        description: |
          Whether the version is already a tag on `HEAD`.

          - `true` on a rerun of a released commit, else `false`
        value: ${{ jobs.surveyor.outputs.tagged }}
      cargo_publish_args:
        description: |
          `-p` flag for each bumped crate that can be published.

          - Empty if no crate needs publishing
        value: ${{ jobs.surveyor.outputs.cargo_publish_args }}

jobs:

  # Version every crate from git tags and conventional commits, and render release notes
  #
  # Artifacts:
  # - cargo-manifests: every Cargo.toml and Cargo.lock stamped with the new versions
  # - release-notes.md: skipped for development builds
  surveyor:
    name: Surveyor
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      stage: ${{ steps.version.outputs.stage }}
      channel: ${{ steps.version.outputs.channel }}
      change: ${{ steps.version.outputs.change }}
      tagged: ${{ steps.version.outputs.tagged }}
      cargo_publish_args: ${{ steps.version.outputs.cargo_publish_args }}
    steps:

    - name: Checkout Repo
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Install Surveyor
      run: /home/linuxbrew/.linuxbrew/bin/brew install studiole/tap/surveyor

    - name: surveyor version
      id: version
      run: /home/linuxbrew/.linuxbrew/bin/surveyor --log-level debug version

    - name: surveyor notes
      if: steps.version.outputs.stage != 'development'
      env:
        GH_TOKEN: ${{ github.token }}
      run: /home/linuxbrew/.linuxbrew/bin/surveyor --log-level debug notes > "$RUNNER_TEMP/release-notes.md"

    - name: Upload Release Notes
      if: steps.version.outputs.stage != 'development'
      uses: actions/upload-artifact@v7
      with:
        name: release-notes.md
        path: ${{ runner.temp }}/release-notes.md

    - name: Git Diff
      run: git --no-pager diff --color

    - name: Upload Cargo Manifests
      uses: actions/upload-artifact@v7
      with:
        name: cargo-manifests
        path: |
          **/Cargo.toml
          Cargo.lock
