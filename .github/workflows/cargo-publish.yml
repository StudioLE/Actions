name: Cargo Publish

on:
  workflow_call:
    inputs:
      os:
        required: false
        type: string
        default: ubuntu-latest
      cargo_publish_args:
        required: true
        type: string
        description: |
          `-p` flag for each crate to publish, from Surveyor.

          - Unchanged crates keep a version already on crates.io, so they're left out
          - Cargo publishes the listed crates in dependency order
    secrets:
      cargo_registry_token:
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:

  cargo-publish:
    name: Cargo Publish
    runs-on: ${{ inputs.os }}
    steps:

    - name: git checkout
      uses: actions/checkout@v6

    - name: Download Cargo Manifests
      uses: actions/download-artifact@v8
      with:
        name: cargo-manifests

    - name: Diff
      run: git --no-pager diff --color

    - name: cargo publish
      run: cargo publish --locked --allow-dirty --no-verify ${{ inputs.cargo_publish_args }}
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.cargo_registry_token }}
