name: CI/CD

on:
  workflow_call:
    inputs:
      binary_name:
        required: true
        type: string
      assets_repo_name:
        required: false
        type: string
      assets_repo_path:
        required: false
        type: string
      wasm_bindgen_version:
        required: false
        type: string
        default: 0.2.114
      web_repo_name:
        required: false
        type: string
    secrets:
      cargo_registry_token:
        required: true
      assets_repo_token:
        required: false
      web_repo_token:
        required: false
    outputs:
      version:
        value: ${{ jobs.surveyor.outputs.version }}
      stage:
        value: ${{ jobs.surveyor.outputs.stage }}
      channel:
        value: ${{ jobs.surveyor.outputs.channel }}
      change:
        value: ${{ jobs.surveyor.outputs.change }}
      tagged:
        value: ${{ jobs.surveyor.outputs.tagged }}

jobs:

  surveyor:
    name: Surveyor
    uses: StudioLE/Actions/.github/workflows/rust-surveyor.yml@v8

  test:
    name: Test
    uses: StudioLE/Actions/.github/workflows/bevy-test.yml@v8
    needs:
    - surveyor

  build:
    name: Build
    uses: StudioLE/Actions/.github/workflows/bevy-build.yml@v8
    if: needs.surveyor.outputs.stage != 'development'
    needs:
    - surveyor
    with:
      version: ${{ needs.surveyor.outputs.version }}
      binary_name: ${{ inputs.binary_name }}
      assets_repo_name: ${{ inputs.assets_repo_name }}
      assets_repo_path: ${{ inputs.assets_repo_path }}
      wasm_bindgen_version: ${{ inputs.wasm_bindgen_version }}
    secrets:
      assets_repo_token: ${{ secrets.assets_repo_token }}

  git-tag:
    name: Tag
    if: needs.surveyor.outputs.stage == 'prerelease'
    uses: StudioLE/Actions/.github/workflows/git-tag.yml@v8
    needs:
    - surveyor
    - test
    - build
    with:
      version: ${{ needs.surveyor.outputs.version }}

  github-release:
    name: Release
    if: needs.surveyor.outputs.stage == 'release'
    uses: StudioLE/Actions/.github/workflows/github-release.yml@v8
    needs:
    - surveyor
    - test
    - build
    with:
      stage: ${{ needs.surveyor.outputs.stage }}
      version: ${{ needs.surveyor.outputs.version }}
      binary_name: ${{ inputs.binary_name }}

  push-webassembly:
    name: Push WebAssembly
    if: needs.surveyor.outputs.stage == 'release' && inputs.web_repo_name != ''
    uses: StudioLE/Actions/.github/workflows/push-to-repo.yml@v8
    needs:
    - surveyor
    - test
    - build
    with:
      repo: ${{ inputs.web_repo_name }}
      artifact: WebAssembly
      rm: latest
      path: latest
      copy: v${{ needs.surveyor.outputs.version }}
      message: "feat: Added ${{ needs.surveyor.outputs.version }} WebAssembly build"
    secrets:
      repo_token: ${{ secrets.web_repo_token }}

