name: CI/CD

on:
  workflow_call:
    inputs:
      before_test_linux:
        required: false
        type: string
        default: ""
      before_test_windows:
        required: false
        type: string
        default: ""
      cli_name:
        required: false
        type: string
        default: ""
      cli_project:
        required: false
        type: string
        default: ""
      cli_file:
        required: false
        type: string
        default: true
      docker_name:
        required: false
        type: string
        default: ""
      documentation_source:
        required: false
        type: string
        default: "*/src/bin/Release/*/StudioLE.*.dll"
      documentation_section:
        required: false
        type: string
    secrets:
      packages_token:
        required: true
      gh_token:
        required: true
      tests_token:
        required: true
      documentation_token:
        required: true
      nuget_token:
        required: true
    outputs:
      version:
        value: ${{ jobs.release.outputs.version }}
      environment:
        value: ${{ jobs.release.outputs.environment }}
      type:
        value: ${{ jobs.release.outputs.type }}

jobs:

  test-ubuntu:
    name: Ubuntu
    uses: StudioLE/Actions/.github/workflows/dotnet-test.yml@v7
    with:
      project: ""
      os: ubuntu-latest
      run-before: ${{ inputs.before_test_linux }}
      nuget_feed: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      nuget_username: ${{ github.repository_owner }}
      pack: true
    secrets:
      nuget_password: ${{ secrets.packages_token }}

  test-windows:
    name: Windows
    if: github.ref_type == 'branch' && contains(fromJSON('["main", "alpha", "beta", "release"]'), github.ref_name)
    uses: StudioLE/Actions/.github/workflows/dotnet-test.yml@v7
    with:
      project: ""
      os: windows-latest
      run-before: ${{ inputs.before_test_windows }}
      nuget_feed: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      nuget_username: ${{ github.repository_owner }}
    secrets:
      nuget_password: ${{ secrets.packages_token }}

  publish-cli-linux:
    name: Linux CLI
    if: github.ref_type == 'branch' && contains(fromJSON('["main", "alpha", "beta", "release"]'), github.ref_name) && inputs.cli_name != ''
    uses: StudioLE/Actions/.github/workflows/dotnet-publish.yml@v7
    with:
      project: ${{ inputs.cli_project }}
      runtime: linux-x64
      npm: ""
      workload: ""
      properties: >
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        -p:SelfContained=false
        -p:DebugType=embedded
        -p:GenerateDocumentationFile=false
      artifact: Cli-Linux
      nuget_feed: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      nuget_username: ${{ github.repository_owner }}
    secrets:
      nuget_password: ${{ secrets.packages_token }}

  publish-cli-windows:
    name: Windows CLI
    if: github.ref_type == 'branch' && contains(fromJSON('["main", "alpha", "beta", "release"]'), github.ref_name) && inputs.cli_name != ''
    uses: StudioLE/Actions/.github/workflows/dotnet-publish.yml@v7
    with:
      project: ${{ inputs.cli_project }}
      runtime: win-x64
      npm: ""
      workload: ""
      properties: >
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        -p:SelfContained=false
        -p:DebugType=embedded
        -p:GenerateDocumentationFile=false
      artifact: Cli-Windows
      nuget_feed: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      nuget_username: ${{ github.repository_owner }}
    secrets:
      nuget_password: ${{ secrets.packages_token }}

  documentation:
    name: Documentation
    if: github.ref_type == 'branch' && contains(fromJSON('["main", "alpha", "beta", "release"]'), github.ref_name) && inputs.documentation_section != ''
    uses: StudioLE/Actions/.github/workflows/illuminate-generate.yml@v7
    with:
      project: ""
      os: ubuntu-latest
      nuget_feed: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      nuget_username: ${{ github.repository_owner }}
      latest: ${{ github.ref_type == 'branch' && github.ref_name == 'release' }}
      source: ${{ inputs.documentation_source }}
      section: ${{ inputs.documentation_section }}
    secrets:
      nuget_password: ${{ secrets.packages_token }}

  release:
    name: Release
    if: github.ref_type == 'branch' && contains(fromJSON('["main", "alpha", "beta", "release"]'), github.ref_name)
    needs:
    - test-ubuntu
    uses: StudioLE/Actions/.github/workflows/surveyor-release.yml@v7
    with:
      nuget_feed: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      nuget_username: ${{ github.repository_owner }}
    secrets:
      nuget_password: ${{ secrets.packages_token }}

  docker-build:
    name: Docker Build
    if: github.ref_type == 'branch' && contains(fromJSON('["main", "alpha", "beta", "release"]'), github.ref_name) && inputs.docker_name != ''
    uses: StudioLE/Actions/.github/workflows/docker-build.yml@v7
    with:
      name: ${{ inputs.docker_name }}
      user: studiole
    secrets:
      password: ${{ secrets.gh_token }}

  docker-push-prerelease:
    name: Prerelease
    if: needs.release.outputs.type == 'prerelease'
    needs:
    - docker-build
    - release
    uses: StudioLE/Actions/.github/workflows/docker-push.yml@v7
    with:
      name: ${{ inputs.docker_name }}
      user: studiole
      version: ${{ needs.release.outputs.version }}
      tag: alpha
    secrets:
      password: ${{ secrets.gh_token }}

  docker-push-release:
    name: Release
    if: needs.release.outputs.type == 'release'
    needs:
    - docker-build
    - release
    uses: StudioLE/Actions/.github/workflows/docker-push.yml@v7
    with:
      name: ${{ inputs.docker_name }}
      user: studiole
      version: ${{ needs.release.outputs.version }}
      tag: latest
    secrets:
      password: ${{ secrets.gh_token }}

  push-tests:
    name: Test Results
    if: always()
    needs:
    - test-ubuntu
    uses: StudioLE/Actions/.github/workflows/push-to-repo.yml@v7
    with:
      repo: StudioLE/Tests
      artifact: Tests-Linux-X64
      rm: "${{ github.repository }}/${{ github.run_id }}"
      path: "${{ github.repository }}/${{ github.run_id }}"
      message: "feat(${{ github.repository }}): Added test results for ${{ github.sha }}"
    secrets:
      repo_token: ${{ secrets.tests_token }}

  push-tests-windows:
    name: Test Results
    if: always()
    needs:
    - push-tests
    - test-windows
    uses: StudioLE/Actions/.github/workflows/push-to-repo.yml@v7
    with:
      repo: StudioLE/Tests
      artifact: Tests-Windows-X64
      rm: ""
      path: "${{ github.repository }}/${{ github.run_id }}/windows"
      message: "feat(${{ github.repository }}): Added windows test results for ${{ github.sha }}"
    secrets:
      repo_token: ${{ secrets.tests_token }}

  push-packages:
    name: GitHub
    needs:
    - release
    uses: StudioLE/Actions/.github/workflows/push-to-nuget.yml@v7
    with:
      nuget_feed: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      nuget_username: ${{ github.repository_owner }}
    secrets:
      nuget_password: ${{ secrets.gh_token }}

  push-nuget:
    name: NuGet
    if: needs.release.outputs.type == 'release'
    needs:
    - release
    uses: StudioLE/Actions/.github/workflows/push-to-nuget.yml@v7
    with:
      nuget_feed: https://api.nuget.org/v3/index.json
      nuget_username: ""
    secrets:
      nuget_password: ${{ secrets.nuget_token }}

  push-cli-linux:
    name: Linux Cli
    if: needs.release.outputs.type == 'release'
    needs:
    - publish-cli-linux
    - release
    uses: StudioLE/Actions/.github/workflows/push-to-github-releases.yml@v7
    with:
      artifact: Cli-Linux
      name: ${{ inputs.cli_name }}-linux-x64-v${{ needs.release.outputs.version }}
      file: ${{ inputs.cli_file }}
      version: ${{ needs.release.outputs.version }}

  push-cli-windows:
    name: Windows Cli
    if: needs.release.outputs.type == 'release'
    needs:
    - test-windows
    - publish-cli-windows
    - release
    uses: StudioLE/Actions/.github/workflows/push-to-github-releases.yml@v7
    with:
      artifact: Cli-Windows
      name: ${{ inputs.cli_name }}-win-x64-v${{ needs.release.outputs.version }}.exe
      file: ${{ inputs.cli_file }}
      version: ${{ needs.release.outputs.version }}

  push-documentation:
    name: Documentation
    if: needs.release.outputs.type == 'release'
    needs:
    - documentation
    - release
    uses: StudioLE/Actions/.github/workflows/push-to-repo.yml@v7
    with:
      repo: StudioLE/Documentation
      artifact: Documentation
      path: ""
      message: "feat(${{ inputs.documentation_section }}): Added documentation for v${{ needs.release.outputs.version }}"
    secrets:
      repo_token: ${{ secrets.documentation_token }}

  environment:
    name: Environment
    if: needs.release.outputs.environment != ''
    needs:
    - release
    runs-on: ubuntu-latest
    environment: ${{ needs.release.outputs.environment }}
    steps:
    - run: |
        echo "Environment: ${{ needs.release.outputs.environment }}"
