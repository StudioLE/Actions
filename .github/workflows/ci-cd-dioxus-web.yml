name: CI/CD

on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
      dioxus_version:
        required: true
        type: string
      artifact_name:
        required: false
        type: string
        default: WebAssembly
      web_repo_name:
        required: false
        type: string
      sign_commits:
        required: false
        type: string
    secrets:
      web_repo_token:
        required: true
      gpg_key_id:
        required: false
        description: 'GPG key ID for signing commits'
      gpg_private_key:
        required: false
        description: 'GPG private key for signing commits'
    outputs:
      version:
        value: ${{ jobs.surveyor.outputs.version }}
      environment:
        value: ${{ jobs.surveyor.outputs.environment }}
      type:
        value: ${{ jobs.surveyor.outputs.type }}

jobs:

  surveyor:
    name: Surveyor
    uses: StudioLE/Actions/.github/workflows/rust-surveyor.yml@v7

  dioxus-build-web:
    name: Dioxus Build
    uses: StudioLE/Actions/.github/workflows/dioxus-build-web.yml@v7
    needs:
    - surveyor
    with:
      package_name: ${{ inputs.package_name }}
      dioxus_version: ${{ inputs.dioxus_version }}
      artifact_name: ${{ inputs.artifact_name }}
      version: ${{ needs.surveyor.outputs.version }}

  git-tag:
    name: Tag
    if: needs.surveyor.outputs.type == 'prerelease'
    uses: StudioLE/Actions/.github/workflows/git-tag.yml@v7
    needs:
    - surveyor
    - dioxus-build-web
    with:
      version: ${{ needs.surveyor.outputs.version }}

  github-release:
    name: Release
    if: needs.surveyor.outputs.type == 'release'
    uses: StudioLE/Actions/.github/workflows/github-release.yml@v7
    needs:
    - surveyor
    - dioxus-build-web
    with:
      type: ${{ needs.surveyor.outputs.type }}
      version: ${{ needs.surveyor.outputs.version }}
      binary_name: ${{ inputs.package_name }}

  dioxus-push:
    name: Push Dioxus
    if: needs.surveyor.outputs.type == 'release' && inputs.web_repo_name != ''
    uses: StudioLE/Actions/.github/workflows/push-to-repo.yml@v7
    needs:
    - surveyor
    - dioxus-build-web
    with:
      repo: ${{ inputs.web_repo_name }}
      artifact: ${{ inputs.artifact_name }}
      rm: latest
      path: latest
      copy: v${{ needs.surveyor.outputs.version }}
      message: "feat: Added ${{ needs.surveyor.outputs.version }} WebAssembly build"
      sign: ${{ inputs.sign_commits }}
    secrets:
      repo_token: ${{ secrets.web_repo_token }}
      gpg_key_id: ${{ secrets.gpg_key_id }}
      gpg_private_key: ${{ secrets.gpg_private_key }}

  environment:
    name: Environment
    if: needs.surveyor.outputs.environment != ''
    needs:
    - surveyor
    - dioxus-build-web
    runs-on: ubuntu-latest
    environment: ${{ needs.surveyor.outputs.environment }}
    steps:
    - run: |
        echo "Environment: ${{ needs.surveyor.outputs.environment }}"
