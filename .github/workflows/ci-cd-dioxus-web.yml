name: CI/CD

on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
      dioxus_version:
        required: true
        type: string
      artifact_name:
        required: false
        type: string
        default: WebAssembly
      web_repo_name:
        required: false
        type: string
    secrets:
      web_repo_token:
        required: true
    outputs:
      version:
        value: ${{ jobs.surveyor.outputs.version }}
      stage:
        value: ${{ jobs.surveyor.outputs.stage }}
      channel:
        value: ${{ jobs.surveyor.outputs.channel }}
      change:
        value: ${{ jobs.surveyor.outputs.change }}
      tagged:
        value: ${{ jobs.surveyor.outputs.tagged }}

jobs:

  surveyor:
    name: Surveyor
    uses: StudioLE/Actions/.github/workflows/rust-surveyor.yml@v8

  dioxus-build-web:
    name: Dioxus Build
    uses: StudioLE/Actions/.github/workflows/dioxus-build-web.yml@v8
    needs:
    - surveyor
    with:
      package_name: ${{ inputs.package_name }}
      dioxus_version: ${{ inputs.dioxus_version }}
      artifact_name: ${{ inputs.artifact_name }}
      version: ${{ needs.surveyor.outputs.version }}

  git-tag:
    name: Tag
    if: needs.surveyor.outputs.stage == 'prerelease' && needs.surveyor.outputs.tagged != 'true'
    uses: StudioLE/Actions/.github/workflows/git-tag.yml@v8
    needs:
    - surveyor
    - dioxus-build-web
    with:
      version: ${{ needs.surveyor.outputs.version }}

  github-release:
    name: Release
    if: needs.surveyor.outputs.stage == 'release' && needs.surveyor.outputs.tagged != 'true'
    uses: StudioLE/Actions/.github/workflows/github-release.yml@v8
    needs:
    - surveyor
    - dioxus-build-web
    with:
      stage: ${{ needs.surveyor.outputs.stage }}
      version: ${{ needs.surveyor.outputs.version }}
      binary_name: ${{ inputs.package_name }}

  dioxus-push:
    name: Push Dioxus
    if: needs.surveyor.outputs.stage == 'release' && needs.surveyor.outputs.tagged != 'true' && inputs.web_repo_name != ''
    uses: StudioLE/Actions/.github/workflows/push-to-repo.yml@v8
    needs:
    - surveyor
    - dioxus-build-web
    with:
      repo: ${{ inputs.web_repo_name }}
      artifact: ${{ inputs.artifact_name }}
      rm: latest
      path: latest
      copy: v${{ needs.surveyor.outputs.version }}
      message: "feat: Added ${{ needs.surveyor.outputs.version }} WebAssembly build"
    secrets:
      repo_token: ${{ secrets.web_repo_token }}
