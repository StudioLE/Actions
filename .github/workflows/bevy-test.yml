name: Test

on:
  workflow_call:
    inputs:
      os:
        required: false
        type: string
        default: ubuntu-latest
      git_user:
        required: false
        type: string
        default: CI/CD
      git_email:
        required: false
        type: string
        default: cicd.tbxeq@passmail.com

env:
  CARGO_TERM_COLOR: always

jobs:

  test:
    name: Test
    runs-on: ${{ inputs.os }}
    steps:

    - name: Fetch dependencies
      run: sudo apt-get update

    - name: Install dependencies
      run: >
        sudo apt-get install
        g++
        pkg-config
        libx11-dev
        libasound2-dev
        libudev-dev
        libxkbcommon-x11-0
        libwayland-dev
        libxkbcommon-dev

    - name: Checkout Repo
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Restore Cargo
      id: cargo-cache
      uses: actions/cache/restore@v5
      with:
        key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_number }}
        restore-keys: |
          cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
          cargo-${{ runner.os }}-
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/

    - name: Download Cargo Manifests
      uses: actions/download-artifact@v8
      with:
        name: cargo-manifests

    - name: Cargo Build
      run: cargo build --release --locked --features bevy/dynamic_linking

    - name: Cache Cargo
      if: always()
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/

    - name: Git Config
      run: |
        git config user.name "${{ inputs.git_user }}"
        git config user.email "${{ inputs.git_email }}"

    - name: Cargo Format
      run: |
        cargo fmt
        git add --all -- ':!Cargo.toml' ':!Cargo.lock'
        if ! git diff --cached --exit-code
        then
          echo "::warning title=Cargo Format::Please review the output for details."
          git commit -m "style: Apply code style with \`cargo fmt\`"
        fi
      continue-on-error: true

    - name: Restore Cargo Fix
      id: cargo-fix-cache
      uses: actions/cache/restore@v5
      with:
        key: cargo-fix-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_number }}
        restore-keys: |
          cargo-fix-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
          cargo-fix-${{ runner.os }}-
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/

    - name: Cargo Fix
      run: |
        cargo fix --all-targets --release --locked --allow-dirty --message-format short
        cargo fmt
        git add --all -- ':!Cargo.toml' ':!Cargo.lock'
        if ! git diff --cached --exit-code
        then
          echo "::warning title=Cargo Fix::Please review the output for details."
          git commit -m "style: Apply code style with \`cargo fix\`"
        fi
      continue-on-error: true

    - name: Cache Fix Cargo
      if: always()
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.cargo-fix-cache.outputs.cache-primary-key }}
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/

    - name: Cargo Clippy
      run: |
        cargo clippy --all-targets --release --locked --fix --allow-dirty --message-format short
        cargo fmt
        git add --all -- ':!Cargo.toml' ':!Cargo.lock'
        if ! git diff --cached --exit-code
        then
          echo "::warning title=Cargo Clippy::Please review the output for details."
          git commit -m "style: Apply code style with \`cargo clippy --fix\`"
        fi
      continue-on-error: true

    - name: Git Status
      run: git status

    - name: Git Push
      run: git push

    - name: Cargo Test
      run: cargo test --release --locked --features bevy/dynamic_linking --no-fail-fast
