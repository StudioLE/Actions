name: CI/CD

on:
  workflow_call:
    inputs:
      package_name:
        required: false
        type: string
      run_before_test:
        required: false
        type: string
      test_args:
        required: false
        type: string
      check_args:
        required: false
        type: string
      matrix:
        required: false
        type: string
        default: |
          [
            {
              "target": "x86_64-unknown-linux-gnu",
              "os": "ubuntu-24.04",
              "test": true
            }
          ]
    secrets:
      cargo_registry_token:
        required: true
    outputs:
      version:
        value: ${{ jobs.surveyor.outputs.version }}
      stage:
        value: ${{ jobs.surveyor.outputs.stage }}
      channel:
        value: ${{ jobs.surveyor.outputs.channel }}
      change:
        value: ${{ jobs.surveyor.outputs.change }}
      tagged:
        value: ${{ jobs.surveyor.outputs.tagged }}

jobs:

  surveyor:
    name: Surveyor
    uses: StudioLE/Actions/.github/workflows/rust-surveyor.yml@v8

  cargo-build:
    name: Cargo Build
    uses: StudioLE/Actions/.github/workflows/cargo-build.yml@v8
    needs:
    - surveyor
    with:
      version: ${{ needs.surveyor.outputs.version }}
      package_name: ${{ inputs.package_name }}
      run_before_test: ${{ inputs.run_before_test }}
      test_args: ${{ inputs.test_args }}
      check_args: ${{ inputs.check_args }}
      matrix: ${{ inputs.matrix }}

  git-tag:
    name: Tag
    if: needs.surveyor.outputs.stage == 'prerelease' && needs.surveyor.outputs.tagged != 'true'
    uses: StudioLE/Actions/.github/workflows/git-tag.yml@v8
    needs:
    - surveyor
    - cargo-build
    with:
      version: ${{ needs.surveyor.outputs.version }}

  github-release:
    name: Release
    if: needs.surveyor.outputs.stage == 'release' && needs.surveyor.outputs.tagged != 'true'
    uses: StudioLE/Actions/.github/workflows/github-release.yml@v8
    needs:
    - surveyor
    - cargo-build
    with:
      version: ${{ needs.surveyor.outputs.version }}

  cargo-publish:
    name: Cargo Publish
    if: needs.surveyor.outputs.stage == 'release' && needs.surveyor.outputs.tagged != 'true' && needs.surveyor.outputs.cargo_publish_args != ''
    uses: StudioLE/Actions/.github/workflows/cargo-publish.yml@v8
    needs:
    - surveyor
    - github-release
    with:
      cargo_publish_args: ${{ needs.surveyor.outputs.cargo_publish_args }}
    secrets:
      cargo_registry_token: ${{ secrets.cargo_registry_token }}
